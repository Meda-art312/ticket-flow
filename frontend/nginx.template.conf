server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend "${BACKEND_UPSTREAM}";
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location = /health/live { access_log off; default_type application/json; return 200 '{"status":"live"}'; }
  location = /health/integration { proxy_pass $backend/health/ready; proxy_connect_timeout 3s; proxy_read_timeout 5s; }
  location /api/v1 {
    proxy_pass $backend$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_intercept_errors on;
    error_page 502 504 =503 /upstream-error;
  }
  location = /upstream-error { internal; default_type application/json; return 503 '{"code":"UPSTREAM_UNAVAILABLE","message":"TicketFlow cannot reach the backend. Try again shortly."}'; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location / { try_files $uri $uri/ /index.html; expires -1; }
}
