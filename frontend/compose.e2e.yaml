name: ticketflow-frontend-e2e
services:
  postgres:
    extends: { file: "${BACKEND_SOURCE_DIR:-../backend}/compose.test.yaml", service: postgres }
    volumes: [e2e-postgres:/var/lib/postgresql/data]
  redis:
    extends: { file: "${BACKEND_SOURCE_DIR:-../backend}/compose.test.yaml", service: redis }
  rabbitmq:
    extends: { file: "${BACKEND_SOURCE_DIR:-../backend}/compose.test.yaml", service: rabbitmq }
    volumes: [e2e-rabbitmq:/var/lib/rabbitmq]
  mailpit:
    extends: { file: "${BACKEND_SOURCE_DIR:-../backend}/compose.test.yaml", service: mailpit }
  migrate:
    extends: { file: "${BACKEND_SOURCE_DIR:-../backend}/compose.test.yaml", service: migrate }
    build: { context: "${BACKEND_SOURCE_DIR:-../backend}", target: production }
  api:
    extends: { file: "${BACKEND_SOURCE_DIR:-../backend}/compose.test.yaml", service: api }
    build: { context: "${BACKEND_SOURCE_DIR:-../backend}", target: production }
    environment:
      PUBLIC_API_URL: http://api:3000
      FRONTEND_ORIGIN: http://localhost:8080
      RESERVATION_SECONDS: 40
  worker:
    extends: { file: "${BACKEND_SOURCE_DIR:-../backend}/compose.recovery.yaml", service: worker }
    build: { context: "${BACKEND_SOURCE_DIR:-../backend}", target: production }
    environment:
      PUBLIC_API_URL: http://api:3000
      FRONTEND_ORIGIN: http://localhost:8080
      RESERVATION_SECONDS: 40
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  seed:
    extends: { file: "${BACKEND_SOURCE_DIR:-../backend}/compose.test.yaml", service: migrate }
    build: { context: "${BACKEND_SOURCE_DIR:-../backend}", target: production }
    environment:
      SEED_PASSWORD: ${E2E_PASSWORD:?Generate .env.e2e using scripts/e2e-env.mjs}
    command: [node, dist/scripts/seed.js]
    depends_on: { migrate: { condition: service_completed_successfully } }
  web:
    build: { context: ., target: production }
    environment: { BACKEND_UPSTREAM: "http://api:3000" }
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/live]
      interval: 3s
      timeout: 3s
      retries: 20
  unavailable:
    build: { context: ., target: production }
    environment: { BACKEND_UPSTREAM: "http://missing-e2e-upstream:3000" }
  e2e:
    build: { context: ., target: e2e }
    network_mode: service:web
    ipc: host
    environment:
      BASE_URL: http://localhost:8080
      API_URL: http://api:3000/api/v1
      E2E_PASSWORD: ${E2E_PASSWORD:?Generate .env.e2e}
      # Backend-owned local test tooling; never included in Vite assets.
      E2E_INTERNAL_SECRET: test-only-internal-secret-00000000000000000
    volumes: ["./artifacts:/app/artifacts", "./.impeccable/review:/app/.impeccable/review"]
    depends_on:
      web: { condition: service_healthy }
      worker: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
volumes:
  e2e-postgres:
  e2e-rabbitmq:
